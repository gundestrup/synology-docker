name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: Docker regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image
        run: docker build -t synology-docker-tests -f tests/Dockerfile .

      - name: Run regression tests
        run: docker run --rm -v "$PWD:/workspace:ro" synology-docker-tests

  shell-analysis:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLo /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/shellcheck.tar.xz -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck

      - name: Check Bash syntax
        run: bash -n ./*.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck -x ./*.sh tests/*.sh

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: 'pip3 install --only-binary=:all: -r .github/requirements-ci.txt'

      - name: Run Semgrep security scan
        run: semgrep scan --config p/default --error --metrics=off .
